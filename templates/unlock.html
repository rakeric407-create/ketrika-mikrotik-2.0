{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-custom shadow p-4 text-center">
                <h3 class="fw-bold text-warning mb-3">
                    <i class="fas fa-lock-open me-2"></i>Entrer votre Code PIN
                </h3>
                <p class="text-muted small">Entrez le code reçu après votre paiement Mvola</p>

                <form method="POST" action="/unlock">
                    <div class="mb-3">
                        <input type="text" name="code" class="form-control form-control-lg text-center fw-bold text-warning" 
                               placeholder="Ex: 2000" style="font-size: 1.8rem; letter-spacing: 5px;" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold text-dark mb-3">
                        DÉBLOQUER LE GÉNÉRATEUR
                    </button>
                </form>

                <div class="bg-dark p-3 rounded border border-secondary text-start small">
                    <span class="text-warning fw-bold">💡 Codes de Test Rapides :</span>
                    <ul class="mb-0 mt-1 ps-3 text-muted">
                        <li>Pack 1 (DoH) : <strong>1000</strong></li>
                        <li>Pack 2 (WARP) : <strong>2000</strong></li>
                        <li>Pack 3 (Hotspot) : <strong>3000</strong></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
