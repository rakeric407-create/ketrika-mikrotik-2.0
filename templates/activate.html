{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom shadow p-4">
                <h3 class="fw-bold text-center text-warning mb-4">
                    <i class="fas fa-key me-2"></i>Activation Licence
                </h3>
                <form method="POST" action="/activate">
                    <div class="mb-3">
                        <label class="form-label small text-muted">Clé reçue par SMS / WhatsApp</label>
                        <input type="text" name="license_key" class="form-control text-uppercase" placeholder="KM-WP-XXXX-XXXX-XXXX" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small text-muted">Numéro de série MikroTik</label>
                        <input type="text" name="router_serial" class="form-control" placeholder="Ex: HEC08XXXXXX" required>
                        <div class="form-text">Visible dans Winbox : <em>System > Routerboard</em></div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">
                        Vérifier et Débloquer
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
